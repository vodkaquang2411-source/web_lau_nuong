<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Món Ăn - Lẩu Nướng VN Admin</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">

      <div class="logo-icon" style="width: 38px; height: 38px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 3 2.5 4.5 4.5 5.5C18 8.5 19 10 19 12a7 7 0 1 1-14 0c0-2 1-3.5 2.5-4.5C9.5 6.5 11 5 12 2z"></path></svg>
      </div>
      <div class="logo-text">
        <div class="logo-title" style="font-size: 1.05rem;">Lẩu Nướng VN</div>
        <span class="admin-badge">Cổng quản trị</span>
      </div>
    </div>

    <nav class="admin-nav">
      <a href="index.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Tổng quan (Dashboard)</span>
      </a>

      <a href="products.html" class="admin-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
        <span>Quản lý món ăn</span>
      </a>

      <a href="categories.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>Quản lý danh mục</span>
      </a>

      <a href="reservations.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Quản lý đặt bàn</span>
      </a>

      <a href="branches.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Quản lý chi nhánh</span>
      </a>

      <a href="customers.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Khách hàng</span>
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../index.html" target="_blank">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>Xem Website Khách</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-main">
    <header class="admin-header">
      <h1 class="admin-header-title">Quản Lý Thực Đơn Món Ăn (CRUD)</h1>
      <button class="btn btn-primary" id="btnOpenAddProductModal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Thêm Món Ăn Mới
      </button>
    </header>

    <main class="admin-content">
      <div class="panel">
        <div class="panel-header">
          <!-- Filters & Search Toolbar -->
          <div style="display: flex; gap: 14px; flex-wrap: wrap; width: 100%;">
            <div style="flex: 1; min-width: 250px;">
              <input type="text" id="adminProductSearch" class="form-control" placeholder="Tìm kiếm món ăn theo tên hoặc mô tả...">
            </div>
            <div style="width: 220px;">
              <select id="adminProductCategoryFilter" class="form-control">
                <option value="all">Tất cả danh mục</option>
                <option value="lau">Món Lẩu</option>
                <option value="nuong">Đồ Nướng</option>
                <option value="thit-bo">Thịt Bò</option>
                <option value="hai-san">Hải Sản</option>
                <option value="rau-kem">Rau & Ăn Kèm</option>
                <option value="combo">Combo</option>
                <option value="do-uong">Đồ Uống</option>
              </select>
            </div>
          </div>
        </div>

        <div class="panel-body" style="padding: 0;">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width: 60px;">ID</th>
                  <th style="width: 80px;">Hình ảnh</th>
                  <th>Tên món ăn</th>
                  <th>Danh mục</th>
                  <th>Giá bán</th>
                  <th>Nổi bật</th>
                  <th>Trạng thái</th>
                  <th style="width: 140px; text-align: right;">Hành động</th>
                </tr>
              </thead>
              <tbody id="adminProductsTableBody">
                <!-- Sẽ được đổ tự động bằng JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL -->
  <div class="modal-overlay" id="productFormModal" aria-hidden="true" role="dialog">
    <div class="modal-content" style="max-width: 640px;">
      <button class="modal-close" id="closeProductFormModal">&times;</button>
      <div style="padding: 28px;">
        <h2 id="modalProductTitle" style="color: var(--color-primary); font-size: 1.4rem; margin-bottom: 20px;">Thêm Món Ăn Mới</h2>
        
        <form id="productCrudForm" novalidate>
          <input type="hidden" id="editProductId" value="">

          <div class="form-group">
            <label for="formProductName" class="form-label">Tên món ăn <span class="required">*</span></label>
            <input type="text" id="formProductName" class="form-control" placeholder="Ví dụ: Lẩu Riêu Cua Bắp Bò Sườn Sụn" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label for="formProductCategory" class="form-label">Danh mục <span class="required">*</span></label>
              <select id="formProductCategory" class="form-control" required>
                <option value="lau">Món Lẩu</option>
                <option value="nuong">Đồ Nướng</option>
                <option value="thit-bo">Thịt Bò Mỹ</option>
                <option value="hai-san">Hải Sản</option>
                <option value="rau-kem">Rau & Nấm</option>
                <option value="combo">Combo Tiết Kiệm</option>
                <option value="do-uong">Đồ Uống</option>
              </select>
            </div>

            <div class="form-group">
              <label for="formProductPrice" class="form-label">Giá bán (VNĐ) <span class="required">*</span></label>
              <input type="number" id="formProductPrice" class="form-control" placeholder="Ví dụ: 399000" min="0" step="1000" required>
            </div>
          </div>

          <div class="form-group">
            <label for="formProductImage" class="form-label">Đường dẫn hình ảnh (URL) <span class="required">*</span></label>
            <input type="url" id="formProductImage" class="form-control" placeholder="https://images.unsplash.com/..." required>
          </div>

          <div class="form-group">
            <label for="formProductDesc" class="form-label">Mô tả món ăn</label>
            <textarea id="formProductDesc" class="form-control" rows="3" placeholder="Mô tả nguyên liệu, hương vị món ăn..."></textarea>
          </div>

          <div style="display: flex; gap: 24px; margin-bottom: 24px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem;">
              <input type="checkbox" id="formProductFeatured" style="width: 18px; height: 18px; accent-color: var(--color-brand);">
              <span>Đặt làm món nổi bật trang chủ</span>
            </label>

            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem;">
              <input type="checkbox" id="formProductAvailable" checked style="width: 18px; height: 18px; accent-color: var(--color-success);">
              <span>Còn món (Đang phục vụ)</span>
            </label>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 12px;">
            <button type="button" class="btn btn-secondary" id="btnCancelProductModal">Hủy bỏ</button>
            <button type="submit" class="btn btn-primary" id="btnSaveProduct">Lưu Món Ăn</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="../js/core/state.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/features/admin/admin-common.js"></script>
  <script src="../js/features/admin/products.js"></script>
</body>
</html>
