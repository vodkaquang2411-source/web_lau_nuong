<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - Lẩu Restaurant</title>
  <meta name="description" content="Tạo tài khoản hội viên tại Lẩu Restaurant để tích điểm đổi quà và hưởng ưu đãi đặt bàn đặc quyền.">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, rgba(36,32,30,0.92), rgba(143,23,36,0.9)), url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">

  <div style="max-width: 500px; width: 100%; background: white; border-radius: var(--radius-lg); box-shadow: 0 16px 40px rgba(0,0,0,0.35); overflow: hidden; border: 2px solid var(--color-gold);">
    
    <!-- Header Card -->
    <div style="background: var(--color-primary); color: white; padding: 28px 24px; text-align: center; border-bottom: 3px solid var(--color-gold);">
      <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 8px;">
        <img src="../img/logo.jpg" alt="Logo Lẩu Restaurant" class="site-logo-img">
        <div class="logo-text">
          <div class="logo-title" style="font-size: 1.3rem;">LẨU <span>RESTAURANT</span></div>
        </div>
      </a>
      <p style="color: var(--color-cream); font-size: 0.9rem; margin: 0;">Đăng ký hội viên – Nhận ngay voucher 100.000đ</p>
    </div>

    <!-- Form Content -->
    <div style="padding: 30px 28px;">
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regFullName" class="form-label">Họ và tên của bạn <span class="required">*</span></label>
          <input type="text" id="regFullName" class="form-control" placeholder="Nguyễn Văn A" required>
          <div class="form-error-msg" id="errorRegName">Vui lòng nhập họ và tên (tối thiểu 3 ký tự).</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label for="regPhone" class="form-label">Số điện thoại <span class="required">*</span></label>
            <input type="tel" id="regPhone" class="form-control" placeholder="0912 345 678" required>
            <div class="form-error-msg" id="errorRegPhone">Số điện thoại 10 chữ số.</div>
          </div>

          <div class="form-group">
            <label for="regEmail" class="form-label">Email <span class="required">*</span></label>
            <input type="email" id="regEmail" class="form-control" placeholder="email@gmail.com" required>
            <div class="form-error-msg" id="errorRegEmail">Email không hợp lệ.</div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label for="regPassword" class="form-label">Mật khẩu <span class="required">*</span></label>
            <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
            <div class="form-error-msg" id="errorRegPassword">Tối thiểu 6 ký tự.</div>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Nhập lại mật khẩu <span class="required">*</span></label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
            <div class="form-error-msg" id="errorRegConfirm">Mật khẩu không khớp.</div>
          </div>
        </div>

        <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 22px;">
          <input type="checkbox" id="agreeTerms" style="width: 16px; height: 16px; margin-top: 3px; accent-color: var(--color-brand); cursor: pointer;" required>
          <label for="agreeTerms" style="font-size: 0.85rem; color: var(--color-gray-700); cursor: pointer;">
            Tôi đồng ý với các <a href="#" style="color: var(--color-brand); text-decoration: underline;">Điều khoản dịch vụ</a> và <a href="#" style="color: var(--color-brand); text-decoration: underline;">Chính sách bảo mật</a> của Lẩu Restaurant.
          </label>
        </div>

        <button type="submit" id="btnSubmitRegister" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 16px;">
          Tạo tài khoản
        </button>

        <div style="text-align: center; font-size: 0.92rem; color: var(--color-gray-500);">
          Đã có tài khoản? <a href="login.html" style="color: var(--color-brand); font-weight: 700;">Đăng nhập ngay</a>
        </div>
      </form>
    </div>

    <!-- Back to Home -->
    <div style="background: #F8F9FA; padding: 14px; text-align: center; border-top: 1px solid var(--color-gray-200);">
      <a href="../index.html" style="color: var(--color-gray-500); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;">
        ← Quay lại trang chủ Lẩu Restaurant
      </a>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="../js/core/state.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/features/auth/auth.js"></script>
</body>
</html>
