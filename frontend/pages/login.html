<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập tài khoản - Lẩu Restaurant</title>
  <meta name="description" content="Đăng nhập tài khoản khách hàng hoặc quản trị viên nhà hàng Lẩu Restaurant.">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, rgba(36,32,30,0.92), rgba(143,23,36,0.9)), url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 16px;">

  <div style="max-width: 460px; width: 100%; background: white; border-radius: var(--radius-lg); box-shadow: 0 16px 40px rgba(0,0,0,0.35); overflow: hidden; border: 2px solid var(--color-gold);">
    
    <!-- Header Card -->
    <div style="background: var(--color-primary); color: white; padding: 30px 24px; text-align: center; border-bottom: 3px solid var(--color-gold);">
      <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 8px;">
        <img src="../img/logo.jpg" alt="Logo Lẩu Restaurant" class="site-logo-img">
        <div class="logo-text">
          <div class="logo-title" style="font-size: 1.3rem;">LẨU <span>RESTAURANT</span></div>
        </div>
      </a>
      <p style="color: var(--color-cream); font-size: 0.9rem; margin: 0;">Đăng nhập để đặt bàn nhanh và quản lý ưu đãi</p>
    </div>

    <!-- Form Content -->
    <div style="padding: 32px 28px;">
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email hoặc số điện thoại <span class="required">*</span></label>
          <input type="text" id="loginEmail" class="form-control" placeholder="admin@launuongvn.vn hoặc 0912..." required>
          <div class="form-error-msg" id="errorLoginEmail">Vui lòng nhập email hoặc số điện thoại.</div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="loginPassword" class="form-label" style="margin-bottom: 0;">Mật khẩu <span class="required">*</span></label>
            <a href="#" id="btnForgotPassword" style="font-size: 0.82rem; color: var(--color-brand); font-weight: 500;">Quên mật khẩu?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          <div class="form-error-msg" id="errorLoginPassword">Vui lòng nhập mật khẩu (tối thiểu 6 ký tự).</div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 22px;">
          <input type="checkbox" id="rememberMe" style="width: 16px; height: 16px; accent-color: var(--color-brand); cursor: pointer;">
          <label for="rememberMe" style="font-size: 0.88rem; color: var(--color-gray-700); cursor: pointer;">Ghi nhớ đăng nhập trên thiết bị này</label>
        </div>

        <button type="submit" id="btnSubmitLogin" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 16px;">
          Đăng nhập
        </button>

        <!-- Quick Demo Login Buttons for convenience -->
        <div style="background: var(--color-cream-light); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 20px; border: 1px dashed var(--color-gold);">
          <p style="font-size: 0.8rem; font-weight: 700; color: var(--color-dark); margin-bottom: 8px; text-align: center;">⚡ TRẢI NGHIỆM NHANH (BÀI TẬP LỚN):</p>
          <div style="display: flex; gap: 8px;">
            <button type="button" id="btnDemoAdmin" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.78rem;">Tài khoản Admin</button>
            <button type="button" id="btnDemoCustomer" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.78rem;">Khách hàng</button>
          </div>
        </div>

        <div style="text-align: center; font-size: 0.92rem; color: var(--color-gray-500);">
          Chưa có tài khoản? <a href="register.html" style="color: var(--color-brand); font-weight: 700;">Đăng ký ngay</a>
        </div>
      </form>
    </div>

    <!-- Back to Home -->
    <div style="background: #F8F9FA; padding: 14px; text-align: center; border-top: 1px solid var(--color-gray-200);">
      <a href="../index.html" style="color: var(--color-gray-500); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;">
        ← Quay lại trang chủ Lẩu Restaurant
      </a>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="../js/core/state.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/features/auth/auth.js"></script>
</body>
</html>
